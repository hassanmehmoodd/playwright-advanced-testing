name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate Linux visual baselines and upload them
        type: boolean
        default: false

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --update-snapshots
          else
            npx playwright test
          fi

      - name: Keep an artifact when the run has no failure traces
        if: always()
        run: |
          mkdir -p playwright-report test-results
          if [ -z "$(ls -A test-results)" ]; then
            printf '%s\n' 'No failure traces or screenshots. The HTML report is the run record.' > test-results/README.txt
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload updated visual baselines
        if: always() && github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/**/*-snapshots/**
          retention-days: 14
          if-no-files-found: warn
