<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New case · Harbor Desk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f5f56'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/nav.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="canvas">
      <header class="site-header">
        <div class="header-bar">
          <a class="brand" href="/">
            <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
              <rect width="28" height="28" rx="8" fill="#0f5f56"></rect>
              <path d="M8 8h3v4.2h6V8h3v12h-3v-4.8H11V20H8V8z" fill="#ffffff"></path>
            </svg>
            Harbor Desk
          </a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
            Menu
          </button>
        </div>
        <nav id="site-nav" class="nav-links" aria-label="Primary">
          <a href="/">Overview</a>
          <a href="/form" aria-current="page">Intake</a>
          <a href="/dynamic">Activity</a>
          <a href="/storage">Storage</a>
          <a href="/locale">Locale</a>
        </nav>
      </header>
      <main id="main">
        <h1>New case</h1>
        <p class="lede">
          Client-side rules cover required fields, formats, dates, and matching passwords.
        </p>
        <form id="case-form" class="form-grid" novalidate>
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" autocomplete="name" />
            <p id="full-name-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" />
            <p id="email-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" />
            <p id="phone-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="appointment">Appointment date</label>
            <input id="appointment" name="appointment" type="date" />
            <p id="appointment-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="department">Department</label>
            <select id="department" name="department">
              <option value="">Select a department</option>
              <option>Receiving</option>
              <option>Coding</option>
              <option>Dispatch</option>
            </select>
            <p id="department-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" />
            <p id="password-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
            />
            <p id="confirm-password-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field field-wide">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
            <p id="notes-count" data-testid="notes-count">0 / 120</p>
            <p id="notes-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field field-wide">
            <label class="check" for="consent">
              <input id="consent" name="consent" type="checkbox" />
              I agree to store this sample case.
            </label>
            <p id="consent-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field field-wide actions">
            <button type="submit">Save case</button>
            <p class="status ok" data-testid="save-status" role="status"></p>
          </div>
        </form>
      </main>
      <footer class="site-footer">
        <p>Harbor Desk is a local fixture for browser-automation practice.</p>
        <nav class="utility-links" aria-label="Utility">
          <a href="/network">Network</a>
          <a href="/upload">Files</a>
          <a href="/errors">Errors</a>
          <a href="/a11y-broken">Axe fixture</a>
        </nav>
      </footer>
    </div>
    <script src="/js/form.js" defer></script>
  </body>
</html>
